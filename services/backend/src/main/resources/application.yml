spring:
  application:
    name: strive-backend
  ai:
    mcp:
      server:
        name: strive
        protocol: streamable
        version: 1.0.0
        type: sync
        instructions: >
          Strive is a gym training and nutrition app. Every tool acts only on the currently
          authenticated user's own data - there is no way to act on behalf of anyone else.
          Weight and body-measurement units come from getMyProfile (weightType is LBS or KGS);
          use that unit whenever you display or ask about a weight or measurement. When a tool
          takes an optional date and none is given, it defaults to the server's current UTC
          date, which may not match the user's local day - pass an explicit date whenever the
          user's local "today" matters. Logging food to the daily food log, starting or logging
          a workout session, and changing profile/goals/body-metrics are intentionally not
          available as tools; direct the user to the Strive app for those. Every write tool
          (anything that creates, updates, or deletes data) must be preceded by describing the
          intended change to the user in plain language and getting their explicit confirmation
          before calling it - never call a write tool speculatively. Read tools do not need
          confirmation.
  security:
    oauth2:
      authorizationserver:
        client:
          default-client:
            token:
              access-token-time-to-live: 1h
              reuse-refresh-tokens: false
            registration:
              client-id: "default-client"
              client-secret: "{noop}default-secret"
              client-authentication-methods:
                - "client_secret_basic"
                - "none"
              scopes:
                - "mcp"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - "http://127.0.0.1:8000/authorize/oauth2/code/authserver"
                - "http://localhost:8000/authorize/oauth2/code/authserver"
                # mcp-inspector
                - "http://localhost:6274/oauth/callback"
                # claude code
                - "https://claude.ai/api/mcp/auth_callback"
  cloud:
    azure:
      storage:
        blob:
          connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
          container-name: strive-image-container
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never
server:
  port: 8000